<script>
/*
  Feedback links: open the GitHub feedback form with this page's title and
  address filled in. Rewrites Quarto's "Report an issue" link in the margin
  and adds a line at the end of the page.
*/
(function () {
  var main = document.querySelector("main#quarto-document-content");
  if (!main) return; // slides and other formats
  var heading = document.querySelector("h1.title");
  var pageTitle = (heading ? heading.textContent : document.title).trim();
  var url = "https://github.com/pbeens/ics3u/issues/new?template=feedback.yml" +
    "&title=" + encodeURIComponent("[" + pageTitle + "] ") +
    "&page=" + encodeURIComponent(window.location.href.split("#")[0]);
  var label = "Report an error or suggest a change";

  function rewrite(a) {
    a.href = url;
    a.setAttribute("data-original-href", url);
    a.target = "_blank";
    a.rel = "noopener";
    a.innerHTML = '<i class="bi bi-github"></i>' + label;
  }
  function rewriteAll() {
    document.querySelectorAll('a[href$="/issues/new"]').forEach(rewrite);
  }
  // Quarto copies the margin links after this script runs, so repeat on load
  // and catch any copy at click time.
  rewriteAll();
  window.addEventListener("load", rewriteAll);
  document.addEventListener("click", function (e) {
    var a = e.target.closest && e.target.closest('a[href$="/issues/new"]');
    if (a) rewrite(a);
  }, true);

  if (document.querySelector(".feedback-section")) return; // page has its own Feedback section
  var note = document.createElement("p");
  note.className = "feedback-link small text-muted";
  note.style.marginTop = "3rem";
  note.innerHTML = 'Found a mistake or have an idea? <a target="_blank" rel="noopener" href="' +
    url + '">' + label + "</a> on GitHub. Feedback is always appreciated.";
  main.appendChild(note);
})();
</script>
