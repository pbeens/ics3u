<script>
/*
  Feedback links: open the GitHub feedback form with this page's title and
  address filled in. Rewrites Quarto's "Report an issue" link in the margin
  and adds a line at the end of the page, which also links the Google Form
  (for people without a GitHub account) with this page's address filled in.
*/
(function () {
  var main = document.querySelector("main#quarto-document-content");
  if (!main) return; // slides and other formats
  var heading = document.querySelector("h1.title");
  var pageTitle = (heading ? heading.textContent : document.title).trim();
  var url = "https://github.com/pbeens/ics3u/issues/new?template=feedback.yml" +
    "&title=" + encodeURIComponent("[" + pageTitle + "] ") +
    "&page=" + encodeURIComponent(window.location.href.split("#")[0]);
  var label = "Report an error or suggest a change";
  var formUrl = "https://docs.google.com/forms/d/e/1FAIpQLScI9qD_mr02kj8sqVdfarnlmPOxlr66rbpZL0aRaIlB37XQiQ/viewform?usp=pp_url&entry.1446477366=" +
    encodeURIComponent(window.location.href.split("#")[0]);

  function rewrite(a) {
    a.href = url;
    a.setAttribute("data-original-href", url);
    a.target = "_blank";
    a.rel = "noopener";
    a.innerHTML = '<i class="bi bi-github"></i>' + label + ' (GitHub)';
    addPrivate(a);
  }
  // Beside each GitHub link, add the private Google Form option.
  function addPrivate(a) {
    var li = a.closest("li");
    if (!li || (li.nextElementSibling && li.nextElementSibling.classList.contains("feedback-private"))) return;
    var item = document.createElement("li");
    item.className = "feedback-private";
    item.innerHTML = '<a class="' + a.className + '" target="_blank" rel="noopener" href="' + formUrl +
      '"><i class="bi bi-envelope"></i>Send feedback privately (no account)</a>';
    li.parentNode.insertBefore(item, li.nextSibling);
  }
  function rewriteAll() {
    document.querySelectorAll('a[href$="/issues/new"], a[href*="/issues/new?template=feedback.yml"]').forEach(rewrite);
  }
  // Quarto copies the margin links after this script runs, so repeat on load
  // and catch any copy at click time.
  rewriteAll();
  window.addEventListener("load", rewriteAll);
  document.addEventListener("click", function (e) {
    var a = e.target.closest && e.target.closest('a[href$="/issues/new"]');
    if (a) rewrite(a);
  }, true);

  if (document.querySelector(".feedback-section")) return; // page has its own Feedback section
  var note = document.createElement("p");
  note.className = "feedback-link small text-muted";
  note.style.marginTop = "3rem";
  note.innerHTML = 'Found a mistake or have an idea? <a target="_blank" rel="noopener" href="' +
    url + '">' + label + '</a> on GitHub, or <a target="_blank" rel="noopener" href="' +
    formUrl + '">send it privately</a> (no account needed). Feedback is always appreciated.';
  main.appendChild(note);
})();
</script>
